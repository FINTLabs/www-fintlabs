<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>FINTLabs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

  <meta name="description" content="FINTLabs hjemmeside" />
  <meta name="keywords"
    content="fintlabs,fint,fylkeskommune,kommune,api,digitalisering,modell,informasjonsmodell,data" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="icon" href="/_media/favicon.ico" />

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/core.min.css" />

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/addons/core-dark.min.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css" />
  <link rel="stylesheet" href="/css/theme-custom.css" />
  <link rel="stylesheet" href="/css/to-top-button.css" />
</head>

<body class="loading">
  <div id="app"></div>

  <button type="button" onclick="scrollToTop()" class="to-top-button" id="f-to-top-button" aria-label="Scroll to top">
    <i class="fas fa-arrow-up" aria-hidden="true"></i>
  </button>

  <script src="//cdn.jsdelivr.net/npm/mermaid@9.3.0/dist/mermaid.min.js"></script>

  <script>
    let mermaidDiagramNumber = 0;

    mermaid.initialize({
      startOnLoad: false,
      theme: "dark",
      securityLevel: "strict",
    });

    window.$docsify = {
      name: "FINT",
      logo: "/_media/fint-novari.svg",
      homepage: "home.md",

      auto2top: true,
      nativeEmoji: true,

      loadSidebar: true,
      subMaxLevel: 2,

      loadNavbar: true,
      coverpage: true,

      alias: {
        "/.*/_navbar.md": "/_navbar.md",
      },

      markdown: {
        renderer: {
          code({ text, lang }) {
            if (lang === "mermaid") {
              return mermaid.render(
                `mermaid-diagram-${mermaidDiagramNumber++}`,
                text
              );
            }

            return this.origin.code.apply(this, arguments);
          },
        },
      },

      search: {
        paths: "auto",
        placeholder: "Søk",
        noData: "Sorry, men vi fant ingenting 😔",
        depth: 2,
      },

      plantuml: {
        skin: "default",
      },
    }; 
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@5.0.0"></script>

  <script src="//cdn.jsdelivr.net/npm/docsify@5.0.0/dist/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5.0.0/dist/plugins/zoom-image.min.js"></script>

  <script src="//unpkg.com/docsify-copy-code"></script>
  <script src="//unpkg.com/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//unpkg.com/docsify-plantuml/dist/docsify-plantuml.min.js"></script>

  <script src="//unpkg.com/prismjs/components/prism-bash.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-java.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-json.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-csharp.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-yaml.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-go.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-python.min.js"></script>
  <script src="//unpkg.com/prismjs/components/prism-graphql.min.js"></script>

  <script src="/js/to-top.js"></script>
</body>

</html>
