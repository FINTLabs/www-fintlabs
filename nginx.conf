worker_processes 1;
pid /dev/shm/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  # The runtime already supplies /dev/shm; no extra writable volume is needed.
  client_body_temp_path /dev/shm/client_temp;
  proxy_temp_path /dev/shm/proxy_temp;
  fastcgi_temp_path /dev/shm/fastcgi_temp;
  uwsgi_temp_path /dev/shm/uwsgi_temp;
  scgi_temp_path /dev/shm/scgi_temp;

  server {
    listen 8080;
    root /srv/www;
    index index.html;
    server_tokens off;
    charset utf-8;

    # Preserve these headers in locations that add their own Cache-Control header.
    add_header_inherit merge;
    include /etc/nginx/security-headers.conf;

    location ~* \.(html|md)$ {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ =404;
    }

    location ~* \.(css|js)$ {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
      expires 7d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
